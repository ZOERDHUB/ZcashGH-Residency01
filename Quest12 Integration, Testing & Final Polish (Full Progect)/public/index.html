<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Bill — Send with ZEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main class="screen">
    <div class="panel panel--wide">
      <p class="step-cue">1 of 5 — Amount</p>
      <h1 class="title">Send a private payment</h1>
      <p class="subtitle">Pick a currency and how much your recipient should receive. You'll fund it privately with ZEC.</p>
      <div class="exchange-grid">
        <!-- "You send" side: ZEC amount is calculated in Quest 02, this quest only reserves the space -->
        <div class="exchange-box">
          <span class="exchange-box-label">You send</span>
          <div class="exchange-box-amount">
            <span class="exchange-box-value" id="zec-amount">—</span>
            <span class="exchange-box-currency">ZEC</span>
          </div>
          <p class="exchange-box-note" id="zec-note">Calculated on the next step</p>
        </div>
        <div class="exchange-divider" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 9H16M16 9L10.5 3.5M16 9L10.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- "Recipient receives" side: this is what Quest 01 actually implements -->
        <div class="exchange-box exchange-box--active">
          <span class="exchange-box-label">Recipient receives</span>
          <div class="currency-toggle" role="radiogroup" aria-label="Recipient currency">
            <button type="button" class="currency-option is-active" data-currency="NGN" role="radio" aria-checked="true">
              NGN <span class="currency-sub">Nigerian Naira</span>
            </button>
            <button type="button" class="currency-option" data-currency="GHS" role="radio" aria-checked="false">
              GHS <span class="currency-sub">Ghanaian Cedi</span>
            </button>
          </div>
          <div class="amount-input-wrap">
            <span class="amount-symbol" id="currency-symbol">₦</span>
            <input
              type="number"
              id="fiat-amount"
              class="amount-input"
              placeholder="0.00"
              min="0"
              step="0.01"
              inputmode="decimal"
              autocomplete="off"
              aria-label="Amount recipient receives"
            />
          </div>
          <p class="field-error" id="amount-error" hidden></p>
        </div>
      </div>
      <p class="rate-line" id="rate-line">Rate updates once you enter an amount</p>
      <button type="button" class="continue-btn" id="continue-btn" disabled>
        Continue
      </button>
    </div>
  </main>

  <script src="./js/state.js"></script>
  <script src="./js/exchange.js"></script>
  <script src="./js/conversion.js"></script>
</body>
</html>
